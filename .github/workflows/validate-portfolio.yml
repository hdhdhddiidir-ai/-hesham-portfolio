name: Validate Portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "index.ts"
      - "supabase/functions/telegram-bot/**"
      - "scripts/validate-portfolio.mjs"
      - ".github/workflows/validate-portfolio.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "index.ts"
      - "supabase/functions/telegram-bot/**"
      - "scripts/validate-portfolio.mjs"
      - ".github/workflows/validate-portfolio.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portfolio features and inline JavaScript
        run: node scripts/validate-portfolio.mjs
