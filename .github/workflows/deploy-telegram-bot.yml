name: Deploy Telegram Bot to Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/telegram-bot/**"
      - ".github/workflows/deploy-telegram-bot.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Telegram Bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: cdyrtfixvghjjptkuzxg
        run: |
          supabase functions deploy telegram-bot \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api

      - name: Register Telegram webhook and verify configuration
        env:
          SUPABASE_PROJECT_ID: cdyrtfixvghjjptkuzxg
        run: |
          response="$(curl --silent --show-error --fail-with-body "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/telegram-bot")"
          echo "$response" | jq -e '.ok == true and .webhook.ok == true' >/dev/null || {
            echo "::error::Webhook registration failed. Check TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET in Supabase Function Secrets."
            exit 1
          }
          echo "Telegram webhook registered successfully."
